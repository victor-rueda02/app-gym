<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/styles.css">
<title>Gym · Plan 4 semanas</title>
</head>
<body>

<header class="topbar">
  <button class="back" id="back" hidden aria-label="Volver">‹</button>
  <div class="titles">
    <h1 id="title">Hoy</h1>
    <p id="subtitle"></p>
  </div>
  <span class="chip-timer" id="chip-timer" hidden aria-live="off"></span>
  <button class="icon" id="menu" aria-label="Menú">···</button>
</header>

<main id="view"></main>

<nav class="tabbar">
  <button data-tab="today" class="active">Hoy</button>
  <button data-tab="plan">Plan</button>
  <button data-tab="data">Datos</button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-body">
    <h2 id="sheet-title"></h2>
    <div id="sheet-content"></div>
    <button class="btn ghost" id="sheet-close">Cerrar</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="vendor/fflate.js"></script>
<script src="js/plan.js"></script>
<script src="js/store.js"></script>
<script src="js/timer.js"></script>
<script src="js/original-xlsx.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
